}

let _idCounters = {}
function nextId(key) {
  const items = DB.get(key) || []
  return items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1
}

const CRUD = {
  all: key => DB.get(key) || [],
  add: (key, data) => {
    const items = DB.get(key) || []
    const item = { id: nextId(key), ...data, created_at: new Date().toISOString() }
    DB.set(key, [...items, item])
    return item
  },
  update: (key, id, data) => {
    const items = (DB.get(key) || []).map(i => i.id === id ? { ...i, ...data } : i)
    DB.set(key, items)
  },
  remove: (key, id) => DB.set(key, (DB.get(key) || []).filter(i => i.id !== id)),
}

// ===================== TOAST =====================
let toastListeners = []
let toastId = 0
function addToast(msg, type='success') {
  const t = { id: ++toastId, msg, type }
  toastListeners.forEach(fn => fn(t))
}

function ToastContainer() {
  const [toasts, setToasts] = useState([])
  useEffect(() => {
    const fn = t => {
      setToasts(p => [...p, t])
      setTimeout(() => setToasts(p => p.filter(x => x.id !== t.id)), 3000)
    }
    toastListeners.push(fn)
    return () => { toastListeners = toastListeners.filter(f => f !== fn) }
  }, [])
  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:1000, display:'flex', flexDirection:'column', gap:8 }}>
      {toasts.map(t => (
        <div key={t.id} className="toast" style={{
          display:'flex', alignItems:'center', gap:10, padding:'12px 16px',
          borderRadius:12, fontSize:13, fontWeight:500, cursor:'pointer',
          background: t.type==='success' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)',
          border: `1px solid ${t.type==='success' ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.4)'}`,
          color: t.type==='success' ? '#34D399' : '#F87171',
        }} onClick={() => setToasts(p => p.filter(x => x.id !== t.id))}>
          {t.type==='success' ? '✓' : '✕'} {t.msg}
        </div>
      ))}
    </div>
  )
}

// ===================== CHARTS =====================
function DonutChart({ data, colors }) {
  const total = data.reduce((s,d) => s+d.value, 0)
  if (total === 0) return <div style={{ textAlign:'center', color:C.muted, padding:40 }}>ไม่มีข้อมูล</div>
  let cum = 0
  const slices = data.map((d,i) => {
    const pct = d.value / total
    const start = cum, end = cum + pct
    cum = end
    const r = 70, cx = 90, cy = 90, inner = 42
    const a1s = (start*360-90)*Math.PI/180, a1e = (end*360-90)*Math.PI/180
    const large = (end-start) > 0.5 ? 1 : 0
    const x1=cx+r*Math.cos(a1s), y1=cy+r*Math.sin(a1s)
    const x2=cx+r*Math.cos(a1e), y2=cy+r*Math.sin(a1e)
    const xi1=cx+inner*Math.cos(a1e), yi1=cy+inner*Math.sin(a1e)
    const xi2=cx+inner*Math.cos(a1s), yi2=cy+inner*Math.sin(a1s)
    return <path key={i} d={`M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${xi1},${yi1} A${inner},${inner} 0 ${large},0 ${xi2},${yi2} Z`} fill={colors[i%colors.length]} stroke={C.surface} strokeWidth={2} />
  })
  return (
    <div style={{ display:'flex', alignItems:'center', gap:20, flexWrap:'wrap' }}>
      <svg width={180} height={180} viewBox="0 0 180 180">{slices}</svg>

function BarChart({ data }) {
  if (!data.length) return null
  const max = Math.max(...data.flatMap(d => [d.revenue||0, d.profit||0]), 1)
  return (
    <div style={{ display:'flex', gap:12, height:180, alignItems:'flex-end', paddingTop:16 }}>
      {data.map((d,i) => (
        <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
          <div style={{ width:'100%', display:'flex', gap:3, height:160, alignItems:'flex-end' }}>
            <div title={`ยอดขาย: ${numFmt(d.revenue)}`} style={{ flex:1, background:'#3B82F6', borderRadius:'4px 4px 0 0', height:`${(d.revenue/max)*100}%`, minHeight:2 }} />
            <div title={`กำไร: ${numFmt(d.profit)}`} style={{ flex:1, background:'#10B981', borderRadius:'4px 4px 0 0', height:`${(d.profit/max)*100}%`, minHeight:2 }} />
          </div>
          <span style={{ fontSize:11, color:C.muted, textAlign:'center' }}>{d.name}</span>
        </div>
      ))}
    </div>
  )
}

// ===================== STOCK LOG =====================
function logStock({ type, product_id, product_name, product_sku, qty_change, stock_before, stock_after, note='' }) {
  const logs = DB.get('stock_logs') || []
  const id = logs.length > 0 ? Math.max(...logs.map(l=>l.id)) + 1 : 1
  logs.push({ id, type, product_id, product_name, product_sku, qty_change, stock_before, stock_after, note, created_at: new Date().toISOString() })
  DB.set('stock_logs', logs)
}

// ===================== CSV EXPORT =====================
function downloadCSV(filename, headers, rows) {
  const csv = '﻿' + [headers, ...rows].map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}))
  a.download = filename; a.click()
}

// ===================== PRODUCT LIST =====================
const emptyProduct = () => ({ sku:'', name:'', category:'auto_parts', brand:'', store_ids:'', cost_price:0, selling_price:0, stock:0, min_stock:5, lead_time_days:7, supplier_id:'', status:'active', note:'' })

function ProductList() {
  const [items, setItems] = useState([])
  const [suppliers, setSuppliers] = useState([])
  const [search, setSearch] = useState('')
  const [catFilter, setCatFilter] = useState('')
  const [stFilter, setStFilter] = useState('')
  const [modal, setModal] = useState(null)
  const [form, setForm] = useState(emptyProduct())
  const [editId, setEditId] = useState(null)
  const [stockVal, setStockVal] = useState(0)
  const [stockEditId, setStockEditId] = useState(null)
  const [importOpen, setImportOpen] = useState(false)

  const load = () => { setItems(CRUD.all('products')); setSuppliers(CRUD.all('suppliers')) }
  useEffect(load, [])

  const filtered = items.filter(p => {
    const q = search.toLowerCase()
    if (q && !p.name.toLowerCase().includes(q) && !p.sku.toLowerCase().includes(q)) return false
    if (catFilter && p.category !== catFilter) return false
    if (stFilter === 'out' && p.stock !== 0) return false
    if (stFilter === 'low' && (p.stock === 0 || p.stock >= p.min_stock)) return false
    if (stFilter === 'ok' && p.stock < p.min_stock) return false
    return true
  })

  const f = (k,v) => setForm(p => ({...p,[k]:v}))
  const openAdd = () => { setForm(emptyProduct()); setModal('add') }
  const openEdit = p => { setForm({...p, supplier_id: p.supplier_id||''}); setEditId(p.id); setModal('edit') }
  const openStock = p => { setStockVal(p.stock); setStockEditId(p.id); setModal('stock') }

  const save = () => {
    if (!form.sku.trim() || !form.name.trim()) { addToast('กรุณากรอก SKU และชื่อสินค้า','error'); return }
    const data = { ...form, supplier_id: form.supplier_id ? Number(form.supplier_id) : null }
    if (modal==='add') {
      const existing = CRUD.all('products').find(p => p.sku === form.sku)
      if (existing) { addToast('SKU นี้มีอยู่แล้ว','error'); return }
      CRUD.add('products', data)
    } else {
      CRUD.update('products', editId, data)
    }
    addToast('บันทึกสำเร็จ'); setModal(null); load()
  }

  const saveStock = () => {
    const p = items.find(x => x.id === stockEditId)
    const before = p ? p.stock : 0
    const after = Number(stockVal)
    CRUD.update('products', stockEditId, { stock: after })
    if (p) logStock({ type: after >= before ? 'restock' : 'adjust', product_id:p.id, product_name:p.name, product_sku:p.sku, qty_change: after - before, stock_before: before, stock_after: after, note:'อัปเดตสต็อกด้วยมือ' })
    addToast('อัปเดตสต็อกสำเร็จ'); setModal(null); load()
  }

  const del = id => {
    if (!confirm('ลบสินค้านี้?')) return
    CRUD.remove('products', id); addToast('ลบสำเร็จ'); load()
  }

  const exportCSV = () => {
    const h = ['SKU','ชื่อ','หมวด','แบรนด์','ราคาทุน','ราคาขาย','กำไร%','สต็อก','Lead Time','สถานะ']
    const rows = filtered.map(p => [p.sku,p.name,p.category,p.brand,p.cost_price,p.selling_price,profit(p),p.stock,p.lead_time_days,p.status])
    const csv = '﻿' + [h,...rows].map(r=>r.join(',')).join('\n')
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}))
    a.download = 'products.csv'; a.click()
  }

  return (
    <div style={{ padding:24, overflowY:'auto', height:'100%', display:'flex', flexDirection:'column', gap:16 }}>
      <div style={{ display:'flex', gap:10, flexWrap:'wrap', alignItems:'center' }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="ค้นหา SKU / ชื่อสินค้า..."
          style={{ ...S.input, width:220 }} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border} />
        <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} style={{ ...S.input, width:'auto' }}>
          <option value="">ทุกหมวด</option><option value="auto_parts">อะไหล่รถ</option><option value="medical">การแพทย์</option>
        </select>
        <select value={stFilter} onChange={e=>setStFilter(e.target.value)} style={{ ...S.input, width:'auto' }}>
          <option value="">ทุกสต็อก</option><option value="out">หมด</option><option value="low">ต่ำ</option><option value="ok">ปกติ</option>
        </select>
        <button style={S.btn(C.border,C.muted)} onClick={()=>setImportOpen(true)}>📂 Import CSV</button>
        <button style={S.btn(C.border, C.muted)} onClick={()=>downloadCSV('products.csv',
          ['SKU','ชื่อ','หมวด','แบรนด์','ราคาทุน','ราคาขาย','กำไร%','สต็อก','สต็อกขั้นต่ำ','Lead Time','ซัพพลายเออร์','สถานะ'],
          filtered.map(p=>[p.sku,p.name,catLabel(p.category),p.brand,p.cost_price,p.selling_price,profit(p),p.stock,p.min_stock,p.lead_time_days,p.supplier_name||'',p.status])
        )}>⬇ Export CSV</button>
        <button style={{ ...S.btn(), marginLeft:'auto' }} onClick={openAdd}>+ เพิ่มสินค้า</button>
      </div>

      <div style={{ ...S.card, padding:0, overflow:'hidden', flex:1 }}>
        <div style={{ overflowX:'auto', height:'100%' }}>
          <table style={S.table}>
            <thead>
              <tr>{['SKU','ชื่อสินค้า','หมวด','ราคาทุน','ราคาขาย','กำไร%','สต็อก','Lead Time','สถานะ',''].map((h,i)=><th key={i} style={{...S.th,textAlign:['ราคาทุน','ราคาขาย','กำไร%','สต็อก'].includes(h)?'right':h===''?'right':'left'}}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {filtered.map(p => {
                const pct = profit(p)
                return (
                  <tr key={p.id}>
                    <td style={{ ...S.td, fontFamily:'monospace', fontSize:12, color:C.muted }}>{p.sku}</td>
                    <td style={S.td}>
                      <div style={{ fontWeight:600 }}>{p.name}</div>
                      {p.brand && <div style={{ fontSize:11, color:C.muted }}>{p.brand}</div>}
                    </td>
                    <td style={{ ...S.td, color:C.muted }}>{catLabel(p.category)}</td>
                    <td style={{ ...S.td, textAlign:'right', color:C.muted }}>{numFmt(p.cost_price)}</td>
                    <td style={{ ...S.td, textAlign:'right' }}>{numFmt(p.selling_price)}</td>
                    <td style={{ ...S.td, textAlign:'right' }}>
                      <span style={{ fontWeight:600, color: Number(pct)>=30?'#34D399':'#FCD34D' }}>{pct}%</span>
                    </td>
                    <td style={{ ...S.td, textAlign:'right' }}>{p.stock}</td>
                    <td style={S.td}><span style={{ color:C.muted, fontSize:12 }}>{p.lead_time_days} วัน</span></td>
                    <td style={S.td}><StockBadge stock={p.stock} minStock={p.min_stock} /></td>
                    <td style={{ ...S.td, textAlign:'right' }}>
                      <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
                        <button title="อัปเดตสต็อก" onClick={()=>openStock(p)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14 }}>🔄</button>
                        <button onClick={()=>openEdit(p)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14 }}>✏️</button>
                        <button onClick={()=>del(p.id)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14 }}>🗑️</button>
                      </div>
                    </td>
                  </tr>
                )
              })}
            </tbody>
          </table>
        </div>
      </div>

      {(modal==='add'||modal==='edit') && (
        <Modal title={modal==='add'?'เพิ่มสินค้าใหม่':'แก้ไขสินค้า'} onClose={()=>setModal(null)} width={640}>
          <FormGrid>
            <Field label="SKU *"><Inp value={form.sku} onChange={v=>f('sku',v)} /></Field>
            <Field label="หมวด *"><Sel value={form.category} onChange={v=>f('category',v)}><option value="auto_parts">อะไหล่รถ</option><option value="medical">การแพทย์</option><option value="other">อื่นๆ</option></Sel></Field>
            <Field label="ชื่อสินค้า *" span={2}><Inp value={form.name} onChange={v=>f('name',v)} /></Field>
            <Field label="แบรนด์"><Inp value={form.brand} onChange={v=>f('brand',v)} /></Field>
            <Field label="ซัพพลายเออร์">
              <Sel value={form.supplier_id||''} onChange={v=>f('supplier_id',v)}>
                <option value="">-</option>
                {suppliers.map(s=><option key={s.id} value={s.id}>{s.company_name}</option>)}
              </Sel>
            </Field>
            <Field label="ราคาทุน"><Inp type="number" value={form.cost_price} onChange={v=>f('cost_price',Number(v))} /></Field>
            <Field label="ราคาขาย"><Inp type="number" value={form.selling_price} onChange={v=>f('selling_price',Number(v))} /></Field>
            <Field label="สต็อก"><Inp type="number" value={form.stock} onChange={v=>f('stock',Number(v))} /></Field>
            <Field label="สต็อกขั้นต่ำ"><Inp type="number" value={form.min_stock} onChange={v=>f('min_stock',Number(v))} /></Field>
            <Field label="Lead Time (วัน)"><Inp type="number" value={form.lead_time_days} onChange={v=>f('lead_time_days',Number(v))} /></Field>
            <Field label="สถานะ"><Sel value={form.status} onChange={v=>f('status',v)}><option value="active">ใช้งาน</option><option value="inactive">ไม่ใช้</option></Sel></Field>
            <Field label="ร้านที่ขาย (ID คั่นด้วย ,)" span={2}><Inp value={form.store_ids} onChange={v=>f('store_ids',v)} /></Field>
            <Field label="หมายเหตุ" span={2}><Textarea value={form.note} onChange={v=>f('note',v)} /></Field>
          </FormGrid>
          <ModalBtns onCancel={()=>setModal(null)} onSave={save} />
        </Modal>
      )}

      {modal==='stock' && (
        <Modal title="อัปเดตสต็อก" onClose={()=>setModal(null)} width={360}>
          <Field label="จำนวนสต็อกใหม่"><Inp type="number" value={stockVal} onChange={v=>setStockVal(Number(v))} /></Field>
          <ModalBtns onCancel={()=>setModal(null)} onSave={saveStock} />
        </Modal>
      )}
      {importOpen && (
        <ImportModal title="สินค้า" columns={[
          {key:'sku',label:'sku',required:true},{key:'name',label:'name',required:true},{key:'category',label:'category'},
          {key:'brand',label:'brand'},{key:'cost_price',label:'cost_price'},{key:'selling_price',label:'selling_price'},
          {key:'stock',label:'stock'},{key:'min_stock',label:'min_stock'},{key:'lead_time_days',label:'lead_time_days'},
          {key:'status',label:'status'},{key:'note',label:'note'}
        ]} onImport={rows=>{
          rows.forEach(r=>{
            if(CRUD.all('products').find(p=>p.sku===r.sku))return
            CRUD.add('products',{sku:r.sku||'',name:r.name||'',category:r.category||'auto_parts',brand:r.brand||'',store_ids:'',cost_price:Number(r.cost_price)||0,selling_price:Number(r.selling_price)||0,stock:Number(r.stock)||0,min_stock:Number(r.min_stock)||5,lead_time_days:Number(r.lead_time_days)||7,supplier_id:null,status:r.status||'active',note:r.note||''})
          }); load()
        }} onClose={()=>setImportOpen(false)}/>
      )}
    </div>
  )
}

      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))', gap:14 }}>

          <div key={m.id} onClick={()=>openView(m)} style={{ ...S.card, cursor:'pointer', transition:'border-color .2s' }}

function AddStockModal({ onClose }) {
  const [allProducts] = useState(() => CRUD.all('products').filter(p=>p.status==='active'))
  const [lines, setLines] = useState([{ product_id:'', qty:1, note:'' }])

  const visible = search ? allProducts.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.sku.toLowerCase().includes(search.toLowerCase())) : allProducts
  const getP = id => allProducts.find(p=>p.id===Number(id))
  const addLine = () => setLines(p=>[...p,{product_id:'',qty:1,note:''}])
  const removeLine = i => setLines(p=>p.filter((_,j)=>j!==i))
  const upd = (i,k,v) => setLines(p=>p.map((l,j)=>j===i?{...l,[k]:v}:l))

    const valid = lines.filter(l=>l.product_id&&Number(l.qty)>0)

        const ns = p.stock + Number(l.qty)
        CRUD.update('products', p.id, { stock: ns })
        logStock({ type:'restock', product_id:p.id, product_name:p.name, product_sku:p.sku, qty_change:Number(l.qty), stock_before:p.stock, stock_after:ns, note:l.note||'เพิ่มสต็อก' })
      }

    addToast(`✓ เพิ่มสต็อกสำเร็จ ${valid.length} รายการ`); onClose()
  }
  return (
    <Modal title="📥 เพิ่มสต็อก" onClose={onClose} width={680}>
      <div style={{marginBottom:12}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 กรองสินค้า (SKU / ชื่อ)..." style={{...S.input,fontSize:12}} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/>

      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>
        {lines.map((line,i)=>{
          const p=getP(line.product_id), ns=p?p.stock+Number(line.qty):null

            <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 80px 1fr auto',gap:8,alignItems:'center',background:C.bg,padding:'10px 12px',borderRadius:12,border:`1px solid ${C.border}`}}>
              <select value={line.product_id} onChange={e=>upd(i,'product_id',e.target.value)} style={{...S.input,fontSize:12}}>
                <option value="">-- เลือกสินค้า --</option>

// ===================== IMPORT CSV MODAL =====================
function ImportModal({ title, columns, onImport, onClose }) {
  const [text, setText] = useState('')
  const [preview, setPreview] = useState([])
  const [errors, setErrors] = useState([])
  const [file, setFile] = useState(null)

  const parseCSV = raw => {
    const lines = raw.trim().split('\n').map(l=>l.trim()).filter(Boolean)
    if (lines.length < 2) return []
    const headers = lines[0].replace(/^﻿/,'').split(',').map(h=>h.replace(/^"|"$/g,'').trim())
    return lines.slice(1).map((line,ri) => {
      const vals = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g)||[]
      const row = {}
      headers.forEach((h,i)=>{ row[h] = (vals[i]||'').replace(/^"|"$/g,'').trim() })
      return row
    })
  }

  const handleText = raw => {
    setText(raw)
    const rows = parseCSV(raw)
    const errs = []
    columns.filter(c=>c.required).forEach(c=>{
      rows.forEach((r,i)=>{ if (!r[c.label]&&!r[c.key]) errs.push(`แถว ${i+2}: ไม่มีข้อมูล "${c.label}"`) })
    })
    setErrors(errs)
    setPreview(rows.slice(0,5))
  }

  const handleFile = e => {
    const f = e.target.files[0]
    if (!f) return
    setFile(f.name)
    const reader = new FileReader()
    reader.onload = ev => handleText(ev.target.result)
    reader.readAsText(f, 'UTF-8')
  }

  const doImport = () => {
    const rows = parseCSV(text)
    if (!rows.length) { addToast('ไม่พบข้อมูลในไฟล์','error'); return }
    onImport(rows)
    addToast(`นำเข้า ${rows.length} รายการสำเร็จ`)
    onClose()
  }

  const templateLine = columns.map(c=>c.label).join(',')

  return (
    <Modal title={`📂 นำเข้า CSV — ${title}`} onClose={onClose} width={700}>
      <div style={{marginBottom:14,background:C.bg,borderRadius:12,padding:'10px 14px',border:`1px solid ${C.border}`}}>
        <div style={{fontSize:12,color:'#34D399',fontWeight:600,marginBottom:4}}>รูปแบบคอลัมน์ที่รองรับ:</div>
        <code style={{fontSize:11,color:C.muted,wordBreak:'break-all'}}>{templateLine}</code>
        <button onClick={()=>downloadCSV(`template_${title}.csv`,[columns.map(c=>c.label)],[])} style={{...S.btn(C.border,C.muted),fontSize:11,marginTop:8}}>⬇ ดาวน์โหลด Template</button>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:12,alignItems:'center'}}>
        <label style={{...S.btn('#334155','#94A3B8'),cursor:'pointer',fontSize:12}}>
          📎 เลือกไฟล์ .csv
          <input type="file" accept=".csv,.txt" onChange={handleFile} style={{display:'none'}}/>
        </label>
        {file && <span style={{fontSize:12,color:'#34D399'}}>✓ {file}</span>}
      </div>
      <div style={{marginBottom:12}}>
        <label style={S.label}>หรือวาง CSV text ที่นี่:</label>
        <textarea value={text} onChange={e=>handleText(e.target.value)} rows={5} placeholder={`${templateLine}\n(วางข้อมูล CSV ที่นี่)`}
          style={{...S.input,resize:'vertical',fontFamily:'monospace',fontSize:12}} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/>
      </div>
      {errors.length>0 && (
        <div style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.3)',borderRadius:10,padding:'8px 12px',marginBottom:10}}>
          {errors.slice(0,3).map((e,i)=><div key={i} style={{fontSize:12,color:'#F87171'}}>⚠ {e}</div>)}
          {errors.length>3 && <div style={{fontSize:12,color:'#F87171'}}>...และอีก {errors.length-3} รายการ</div>}
        </div>
      )}
      {preview.length>0 && (
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:6}}>ตัวอย่าง {preview.length} แถวแรก:</div>
          <div style={{overflowX:'auto',border:`1px solid ${C.border}`,borderRadius:10}}>
            <table style={{...S.table,fontSize:11}}>
              <thead><tr>{Object.keys(preview[0]).map(k=><th key={k} style={{...S.th,padding:'6px 10px'}}>{k}</th>)}</tr></thead>
              <tbody>{preview.map((r,i)=><tr key={i}>{Object.values(r).map((v,j)=><td key={j} style={{...S.td,padding:'6px 10px',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v}</td>)}</tr>)}</tbody>
            </table>
          </div>
        </div>
      )}
      <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
        <button style={S.btn(C.border,C.muted)} onClick={onClose}>ยกเลิก</button>
        <button style={S.btn()} onClick={doImport} disabled={!text.trim()}>📂 นำเข้าข้อมูล ({parseCSV(text).length} แถว)</button>
      </div>
    </Modal>
  )
}

    setItems(prev => prev.map((l,j) => j===i ? {...l, product_id:pid, unit_price:p?p.selling_price:0, cost_price:p?p.cost_price:0} : l))
  }

  const totalRevenue = items.reduce((s,i)=>s+Number(i.qty)*Number(i.unit_price),0)
  const totalCost = items.reduce((s,i)=>s+Number(i.qty)*Number(i.cost_price),0)
  const grossProfit = totalRevenue - totalCost
  const margin = totalRevenue>0 ? (grossProfit/totalRevenue*100).toFixed(1) : '0'

  const confirm = () => {
    if (!storeId) { addToast('กรุณาเลือกร้านที่ขาย','error'); return }
    const valid = items.filter(i=>i.product_id&&Number(i.qty)>0)
    if (!valid.length) { addToast('กรุณาเพิ่มสินค้าอย่างน้อย 1 รายการ','error'); return }
    const itemDetails = valid.map(i=>{
      const p=getP(i.product_id)
      return {product_id:p.id,product_name:p.name,sku:p.sku,qty:Number(i.qty),unit_price:Number(i.unit_price),cost_price:Number(i.cost_price)}
    })
    CRUD.add('orders',{order_date:date,store_id:Number(storeId),store_name:selStore?.store_name||'',platform:selStore?.platform||'',items:JSON.stringify(itemDetails),total_revenue:totalRevenue,total_cost:totalCost,gross_profit:grossProfit,note})
    valid.forEach(i=>{
      const p=getP(i.product_id)
      if (p) {
        const ns=Math.max(0,p.stock-Number(i.qty))
        CRUD.update('products',p.id,{stock:ns})
        logStock({type:'sale',product_id:p.id,product_name:p.name,product_sku:p.sku,qty_change:-Number(i.qty),stock_before:p.stock,stock_after:ns,note:`ขาย: ${selStore?.store_name||''} (${date})`})
        // update local for subsequent items
        p.stock = ns
      }
    })
    addToast(`✓ บันทึกการขายสำเร็จ ยอด ฿${numFmt(totalRevenue)}`)
    onSaved?.(); onClose()
  }

  return (
    <Modal title="📝 บันทึกการขาย" onClose={onClose} width={780}>
      {/* Header */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginBottom:16}}>
        <div><label style={S.label}>วันที่ขาย *</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={S.input} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/>
        </div>
        <div><label style={S.label}>ร้านที่ขาย *</label>
          <select value={storeId} onChange={e=>setStoreId(e.target.value)} style={S.input}>
            <option value="">-- เลือกร้าน --</option>
            {stores.map(s=><option key={s.id} value={s.id}>[{s.platform}] {s.store_name}</option>)}
          </select>
        </div>
        <div><label style={S.label}>หมายเหตุ</label>
          <input value={note} onChange={e=>setNote(e.target.value)} placeholder="เช่น Order#1234" style={S.input} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/>
        </div>
      </div>
      {/* Filter products */}
      <div style={{marginBottom:10}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 กรองสินค้าในตัวเลือก..." style={{...S.input,fontSize:12}} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/>
      </div>
      {/* Items table */}
      <div style={{border:`1px solid ${C.border}`,borderRadius:12,overflow:'hidden',marginBottom:12}}>
        <table style={{...S.table,fontSize:12}}>
          <thead>
            <tr>
              {['สินค้า','จำนวน','ราคาขาย/หน่วย','ราคาทุน/หน่วย','รวมรายได้','กำไร',''].map(h=>(
                <th key={h} style={{...S.th,padding:'8px 10px',textAlign:['จำนวน','ราคาขาย/หน่วย','ราคาทุน/หน่วย','รวมรายได้','กำไร'].includes(h)?'right':'left'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {items.map((item,i)=>{
              const p=getP(item.product_id)
              const rev=Number(item.qty)*Number(item.unit_price)
              const cost=Number(item.qty)*Number(item.cost_price)
              const gp=rev-cost
              const stockOk=!p||p.stock>=Number(item.qty)
              return (
                <tr key={i} style={{background:!stockOk?'rgba(239,68,68,0.05)':''}}>
                  <td style={{...S.td,padding:'8px 10px'}}>
                    <select value={item.product_id} onChange={e=>handleSelectProductFull(i,e.target.value)} style={{...S.input,fontSize:12,padding:'6px 8px'}}>
                      <option value="">-- เลือกสินค้า --</option>
                      {visible.map(pr=><option key={pr.id} value={pr.id}>{pr.sku} — {pr.name}</option>)}
                    </select>
                    {p&&<div style={{fontSize:10,color:stockOk?C.muted:'#F87171',marginTop:2}}>คงเหลือ: {p.stock} ชิ้น{!stockOk?' ⚠ สต็อกไม่พอ':''}</div>}
                  </td>
                  <td style={{...S.td,padding:'8px 6px'}}><input type="number" min="1" value={item.qty} onChange={e=>updItem(i,'qty',e.target.value)} style={{...S.input,width:60,textAlign:'center',padding:'6px 4px'}} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/></td>
                  <td style={{...S.td,padding:'8px 6px'}}><input type="number" value={item.unit_price} onChange={e=>updItem(i,'unit_price',e.target.value)} style={{...S.input,width:90,textAlign:'right',padding:'6px 8px'}} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/></td>
                  <td style={{...S.td,padding:'8px 6px'}}><input type="number" value={item.cost_price} onChange={e=>updItem(i,'cost_price',e.target.value)} style={{...S.input,width:90,textAlign:'right',padding:'6px 8px'}} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border}/></td>
                  <td style={{...S.td,padding:'8px 10px',textAlign:'right',fontWeight:600}}>{numFmt(rev)}</td>
                  <td style={{...S.td,padding:'8px 10px',textAlign:'right',fontWeight:600,color:gp>=0?'#34D399':'#F87171'}}>{numFmt(gp)}</td>
                  <td style={{...S.td,padding:'8px 6px'}}><button onClick={()=>removeItem(i)} style={{background:'none',border:'none',cursor:'pointer',color:'#F87171',fontSize:16}}>×</button></td>
                </tr>
              )
            })}
          </tbody>
        </table>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:16}}>
        <button onClick={addItem} style={S.btn(C.border,C.muted)}>+ เพิ่มสินค้า</button>
        <div style={{display:'flex',gap:20,background:C.bg,padding:'10px 16px',borderRadius:12,border:`1px solid ${C.border}`}}>
          <div style={{textAlign:'right'}}><div style={{fontSize:11,color:C.muted}}>รายได้รวม</div><div style={{fontSize:18,fontWeight:700,color:'#60A5FA'}}>฿{numFmt(totalRevenue)}</div></div>
          <div style={{textAlign:'right'}}><div style={{fontSize:11,color:C.muted}}>ต้นทุนรวม</div><div style={{fontSize:18,fontWeight:700,color:'#F87171'}}>฿{numFmt(totalCost)}</div></div>
          <div style={{textAlign:'right'}}><div style={{fontSize:11,color:C.muted}}>กำไรขั้นต้น ({margin}%)</div><div style={{fontSize:18,fontWeight:700,color:'#34D399'}}>฿{numFmt(grossProfit)}</div></div>
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
        <button style={S.btn(C.border,C.muted)} onClick={onClose}>ยกเลิก</button>
        <button style={S.btn('#3B82F6')} onClick={confirm}>✓ บันทึกและตัดสต็อก</button>
      </div>
    </Modal>
  )
}

    </div>
  )
}

const emptyAd = () => ({campaign_name:'',platform:'Facebook',store_id:'',start_date:new Date().toISOString().slice(0,10),end_date:'',budget:0,actual_spend:0,impressions:0,clicks:0,orders_count:0,revenue:0,status:'active',note:''})

function AdsPage() {
  const [ads, setAds] = useState([])
  const [stores] = useState(()=>CRUD.all('stores'))
  const [platFilter, setPlatFilter] = useState('')
  const [stFilter, setStFilter] = useState('')
  const [modal, setModal] = useState(null)
  const [form, setForm] = useState(emptyAd())
  const [editId, setEditId] = useState(null)
  const [importOpen, setImportOpen] = useState(false)

  const load = () => setAds(CRUD.all('ads').slice().reverse())
  useEffect(load,[])

  const filtered = ads.filter(a=>(!platFilter||a.platform===platFilter)&&(!stFilter||a.status===stFilter))
  const f = (k,v) => setForm(p=>({...p,[k]:v}))
  const openAdd = () => { setForm(emptyAd()); setModal('add') }
  const openEdit = a => { setForm({...a}); setEditId(a.id); setModal('edit') }

  const save = () => {
    if (!form.campaign_name) { addToast('กรุณากรอกชื่อแคมเปญ','error'); return }
    const data = {...form, store_id:Number(form.store_id), store_name: stores.find(s=>s.id===Number(form.store_id))?.store_name||''}
    if (modal==='add') CRUD.add('ads',data)
    else CRUD.update('ads',editId,data)
    addToast('บันทึกสำเร็จ'); setModal(null); load()
  }
  const del = id => { if(!confirm('ลบแคมเปญนี้?'))return; CRUD.remove('ads',id); addToast('ลบสำเร็จ'); load() }

  const ctr = a => a.impressions>0?(a.clicks/a.impressions*100).toFixed(2):'0'
  const cpc = a => a.clicks>0?(a.actual_spend/a.clicks).toFixed(0):'0'
  const roas = a => a.actual_spend>0?(a.revenue/a.actual_spend).toFixed(2):'0'
  const cpa = a => a.orders_count>0?(a.actual_spend/a.orders_count).toFixed(0):'0'
  const roasColor = r => Number(r)>=3?'#34D399':Number(r)>=1.5?'#FCD34D':'#F87171'

  const totSpend = filtered.reduce((s,a)=>s+a.actual_spend,0)
  const totRev = filtered.reduce((s,a)=>s+a.revenue,0)
  const totOrders = filtered.reduce((s,a)=>s+a.orders_count,0)
  const avgRoas = totSpend>0?(totRev/totSpend).toFixed(2):'0'

  const statusLabel = s => s==='active'?'กำลังยิง':s==='paused'?'หยุดชั่วคราว':'จบแล้ว'
  const statusColor = s => s==='active'?'#34D399':s==='paused'?'#FCD34D':'#94A3B8'

  const importCols = [{key:'campaign_name',label:'campaign_name',required:true},{key:'platform',label:'platform'},{key:'store_name',label:'store_name'},{key:'start_date',label:'start_date'},{key:'end_date',label:'end_date'},{key:'budget',label:'budget'},{key:'actual_spend',label:'actual_spend'},{key:'impressions',label:'impressions'},{key:'clicks',label:'clicks'},{key:'orders_count',label:'orders_count'},{key:'revenue',label:'revenue'},{key:'status',label:'status'},{key:'note',label:'note'}]

  const doImport = rows => {
    rows.forEach(r => {
      const st = stores.find(s=>s.store_name===r.store_name||s.store_name===r['store_name'])
      CRUD.add('ads',{campaign_name:r.campaign_name||r['campaign_name']||'',platform:r.platform||'Facebook',store_id:st?.id||null,store_name:st?.store_name||r.store_name||'',start_date:r.start_date||'',end_date:r.end_date||'',budget:Number(r.budget)||0,actual_spend:Number(r.actual_spend)||0,impressions:Number(r.impressions)||0,clicks:Number(r.clicks)||0,orders_count:Number(r.orders_count)||0,revenue:Number(r.revenue)||0,status:r.status||'active',note:r.note||''})
    }); load()
  }

  return (
    <div style={{padding:24,overflowY:'auto',height:'100%',display:'flex',flexDirection:'column',gap:16}}>
      {/* Summary KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
        {[{label:'งบประมาณรวม',val:'฿'+numFmt(totSpend),icon:'💸',color:'#F97316'},{label:'ยอดขายจาก Ads',val:'฿'+numFmt(totRev),icon:'📈',color:'#3B82F6'},{label:'ออเดอร์รวม',val:totOrders,icon:'🛒',color:'#A855F7'},{label:'ROAS เฉลี่ย',val:avgRoas+'x',icon:'🎯',color:roasColor(avgRoas)}].map(k=>(
          <div key={k.label} style={S.card}>

                  <td style={S.td}>

          </table>

      {modal && (
        <Modal title={modal==='add'?'เพิ่มแคมเปญ':'แก้ไขแคมเปญ'} onClose={()=>setModal(null)} width={680}>
          <FormGrid>
            <Field label="ชื่อแคมเปญ *" span={2}><Inp value={form.campaign_name} onChange={v=>f('campaign_name',v)}/></Field>
            <Field label="Platform *"><Sel value={form.platform} onChange={v=>f('platform',v)}><option>Facebook</option><option>Shopee</option><option>TikTok</option></Sel></Field>
            <Field label="ร้าน"><Sel value={form.store_id} onChange={v=>f('store_id',v)}><option value="">-</option>{stores.map(s=><option key={s.id} value={s.id}>{s.store_name}</option>)}</Sel></Field>
            <Field label="วันเริ่ม"><Inp type="date" value={form.start_date} onChange={v=>f('start_date',v)}/></Field>
            <Field label="วันสิ้นสุด"><Inp type="date" value={form.end_date} onChange={v=>f('end_date',v)}/></Field>
            <Field label="งบประมาณ (฿)"><Inp type="number" value={form.budget} onChange={v=>f('budget',Number(v))}/></Field>
            <Field label="ใช้จริง (฿)"><Inp type="number" value={form.actual_spend} onChange={v=>f('actual_spend',Number(v))}/></Field>
            <Field label="Impressions"><Inp type="number" value={form.impressions} onChange={v=>f('impressions',Number(v))}/></Field>
            <Field label="Clicks"><Inp type="number" value={form.clicks} onChange={v=>f('clicks',Number(v))}/></Field>
            <Field label="ออเดอร์"><Inp type="number" value={form.orders_count} onChange={v=>f('orders_count',Number(v))}/></Field>
            <Field label="ยอดขาย (฿)"><Inp type="number" value={form.revenue} onChange={v=>f('revenue',Number(v))}/></Field>
            <Field label="สถานะ"><Sel value={form.status} onChange={v=>f('status',v)}><option value="active">กำลังยิง</option><option value="paused">หยุดชั่วคราว</option><option value="ended">จบแล้ว</option></Sel></Field>
            {form.actual_spend>0&&(
              <div style={{gridColumn:'1/-1',background:C.bg,borderRadius:10,padding:'10px 14px',display:'flex',gap:24,fontSize:13}}>
                <span>CTR: <b>{form.impressions>0?(form.clicks/form.impressions*100).toFixed(2):0}%</b></span>
                <span>CPC: <b>฿{form.clicks>0?(form.actual_spend/form.clicks).toFixed(0):0}</b></span>
                <span>ROAS: <b style={{color:roasColor(form.actual_spend>0?(form.revenue/form.actual_spend).toFixed(2):0)}}>{form.actual_spend>0?(form.revenue/form.actual_spend).toFixed(2):0}x</b></span>
                <span>CPA: <b>฿{form.orders_count>0?(form.actual_spend/form.orders_count).toFixed(0):0}</b></span>

          </FormGrid>
          <ModalBtns onCancel={()=>setModal(null)} onSave={save}/>

      {importOpen && <ImportModal title="แคมเปญ Ads" columns={importCols} onImport={doImport} onClose={()=>setImportOpen(false)}/>}
    </div>
  )
}

// ===================== SALE MODAL (ตัดสต็อก) =====================
function SaleModal({ onClose }) {
  const [allProducts, setAllProducts] = useState([])
  const [lines, setLines] = useState([{ product_id:'', qty:1 }])
  const [search, setSearch] = useState('')
  const [done, setDone] = useState(false)

  useEffect(() => setAllProducts(CRUD.all('products').filter(p=>p.status==='active')), [])

  const visibleProducts = search
    ? allProducts.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.sku.toLowerCase().includes(search.toLowerCase()))
    : allProducts

  const addLine = () => setLines(p=>[...p,{product_id:'',qty:1}])
  const removeLine = i => setLines(p=>p.filter((_,j)=>j!==i))
  const updateLine = (i,k,v) => setLines(p=>p.map((l,j)=>j===i?{...l,[k]:v}:l))

  const getProduct = id => allProducts.find(p=>p.id===Number(id))

  const confirm = () => {
    const valid = lines.filter(l=>l.product_id&&Number(l.qty)>0)
    if (!valid.length) { addToast('กรุณาเลือกสินค้าและจำนวนที่ขาย','error'); return }
    valid.forEach(l => {
      const p = getProduct(l.product_id)
      if (p) {
        const newStock = Math.max(0, p.stock - Number(l.qty))
        CRUD.update('products', p.id, { stock: newStock })
        logStock({ type:'sale', product_id:p.id, product_name:p.name, product_sku:p.sku, qty_change:-Number(l.qty), stock_before:p.stock, stock_after:newStock, note:'บันทึกการขาย' })
      }
    })
    addToast(`✓ ตัดสต็อกสำเร็จ ${valid.length} รายการ`)
    onClose()
  }

  return (
    <Modal title="🛒 บันทึกการขาย / ตัดสต็อก" onClose={onClose} width={660}>
      {/* Search helper */}
      <div style={{ marginBottom:14 }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 พิมพ์กรองสินค้าในตัวเลือก (SKU / ชื่อ)..."
          style={{ ...S.input, fontSize:12 }} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border} />
      </div>

      {/* Lines */}
      <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:14 }}>
        {lines.map((line,i) => {
          const p = getProduct(line.product_id)
          const newStock = p ? Math.max(0, p.stock - Number(line.qty)) : null
          const isOver = p && Number(line.qty) > p.stock
          return (
            <div key={i} style={{ display:'grid', gridTemplateColumns:'1fr 80px auto auto', gap:8, alignItems:'center', background:C.bg, padding:'10px 12px', borderRadius:12, border:`1px solid ${C.border}` }}>
              <select value={line.product_id} onChange={e=>updateLine(i,'product_id',e.target.value)} style={{ ...S.input, fontSize:12 }}>
                <option value="">-- เลือกสินค้าที่ขาย --</option>
                {visibleProducts.map(pr=>(
                  <option key={pr.id} value={pr.id}>{pr.sku} — {pr.name} (คงเหลือ: {pr.stock})</option>
                ))}
              </select>
              <input type="number" min="1" value={line.qty} onChange={e=>updateLine(i,'qty',e.target.value)}
                placeholder="จำนวน" style={{ ...S.input, textAlign:'center', fontSize:13 }}
                onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border} />
              <div style={{ fontSize:12, whiteSpace:'nowrap', minWidth:120 }}>
                {p ? (
                  <span>
                    <span style={{ color:C.muted }}>{p.stock}</span>
                    <span style={{ color:C.muted }}> → </span>
                    <span style={{ fontWeight:700, color: isOver?'#F87171': newStock<=p.min_stock?'#FCD34D':'#34D399' }}>{newStock}</span>
                    {isOver && <span style={{ color:'#F87171', fontSize:10, display:'block' }}>⚠ เกินสต็อก</span>}
                  </span>
                ) : <span style={{ color:C.border }}>—</span>}
              </div>
              <button onClick={()=>removeLine(i)} style={{ background:'none', border:'none', cursor:'pointer', color:'#F87171', fontSize:18, lineHeight:1, padding:'0 4px' }}>×</button>
            </div>
          )
        })}
      </div>

      <button onClick={addLine} style={{ ...S.btn(C.border, C.muted), marginBottom:20 }}>+ เพิ่มสินค้า</button>

      {/* Summary */}
      {lines.filter(l=>l.product_id&&Number(l.qty)>0).length > 0 && (
        <div style={{ background:'rgba(16,185,129,0.08)', border:'1px solid rgba(16,185,129,0.25)', borderRadius:12, padding:'10px 14px', marginBottom:16, fontSize:12 }}>
          <div style={{ fontWeight:600, color:'#34D399', marginBottom:6 }}>สรุปรายการที่จะตัดสต็อก</div>
          {lines.filter(l=>l.product_id&&Number(l.qty)>0).map((l,i)=>{
            const p = getProduct(l.product_id)
            return p ? <div key={i} style={{ color:C.muted, padding:'2px 0' }}>• {p.name} ลดลง <span style={{ color:C.text, fontWeight:600 }}>{l.qty} ชิ้น</span></div> : null
          })}
        </div>
      )}

      <div style={{ display:'flex', justifyContent:'flex-end', gap:10 }}>
        <button style={S.btn(C.border, C.muted)} onClick={onClose}>ยกเลิก</button>
        <button style={S.btn('#10B981')} onClick={confirm}>✓ ยืนยันตัดสต็อก</button>
      </div>
    </Modal>
  )
}

// ===================== STOCK LOG PAGE =====================
function StockLogPage() {
  const [logs, setLogs] = useState([])
  const [typeFilter, setTypeFilter] = useState('')
  const [search, setSearch] = useState('')
  const [dateFrom, setDateFrom] = useState('')
  const [dateTo, setDateTo] = useState('')

  const load = () => setLogs((DB.get('stock_logs') || []).slice().reverse())
  useEffect(load, [])

  const filtered = logs.filter(l => {
    if (typeFilter && l.type !== typeFilter) return false
    if (search) { const q = search.toLowerCase(); if (!l.product_name.toLowerCase().includes(q) && !l.product_sku.toLowerCase().includes(q)) return false }
    if (dateFrom && l.created_at < dateFrom) return false
    if (dateTo && l.created_at > dateTo + 'T23:59:59') return false
    return true
  })

  const today = new Date().toISOString().slice(0,10)
  const todayLogs = logs.filter(l => l.created_at.startsWith(today))
  const todaySales = todayLogs.filter(l => l.type==='sale')
  const todayRestock = todayLogs.filter(l => l.type==='restock')
  const totalSoldToday = todaySales.reduce((s,l) => s + Math.abs(l.qty_change), 0)
  const totalRestockToday = todayRestock.reduce((s,l) => s + l.qty_change, 0)

  // bar chart: last 7 days sale qty
  const last7 = Array.from({length:7}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate()-i)
    const key = d.toISOString().slice(0,10)
    const sold = logs.filter(l => l.type==='sale' && l.created_at.startsWith(key)).reduce((s,l)=>s+Math.abs(l.qty_change),0)
    const restocked = logs.filter(l => l.type==='restock' && l.created_at.startsWith(key)).reduce((s,l)=>s+l.qty_change,0)
    return { key, label: d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}), sold, restocked }
  }).reverse()

  const maxBar = Math.max(...last7.flatMap(d=>[d.sold, d.restocked]), 1)

  const typeLabel = t => t==='sale'?'ตัดสต็อก':t==='restock'?'เติมสต็อก':'ปรับสต็อก'
  const typeColor = t => t==='sale'?'#F87171':t==='restock'?'#34D399':'#FCD34D'
  const typeBg    = t => t==='sale'?'rgba(239,68,68,0.15)':t==='restock'?'rgba(16,185,129,0.15)':'rgba(234,179,8,0.15)'

  const exportLog = () => downloadCSV('stock_log.csv',
    ['วันที่เวลา','ประเภท','SKU','สินค้า','จำนวนเปลี่ยนแปลง','สต็อกก่อน','สต็อกหลัง','หมายเหตุ'],
    filtered.map(l => [new Date(l.created_at).toLocaleString('th-TH'), typeLabel(l.type), l.product_sku, l.product_name, (l.qty_change>0?'+':'')+l.qty_change, l.stock_before, l.stock_after, l.note])
  )

  return (
    <div style={{ padding:24, overflowY:'auto', height:'100%', display:'flex', flexDirection:'column', gap:20 }}>

      {/* KPI cards */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14 }}>
        {[
          { label:'รายการทั้งหมด', val:logs.length, icon:'📋', color:'#3B82F6' },
          { label:'รายการวันนี้', val:todayLogs.length, icon:'📅', color:'#A855F7' },
          { label:'หน่วยขายวันนี้', val:totalSoldToday, icon:'📤', color:'#F87171' },
          { label:'หน่วยเติมวันนี้', val:totalRestockToday, icon:'📥', color:'#34D399' },
        ].map(k => (
          <div key={k.label} style={S.card}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
              <span style={{ fontSize:12, color:C.muted }}>{k.label}</span>
              <div style={{ width:34, height:34, borderRadius:10, background:k.color+'22', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16 }}>{k.icon}</div>
            </div>
            <div style={{ fontSize:32, fontWeight:700, color:C.text }}>{k.val}</div>
          </div>
        ))}
      </div>

      {/* 7-day bar chart */}
      <div style={S.card}>
        <div style={{ fontWeight:600, marginBottom:4 }}>กิจกรรมสต็อก 7 วันล่าสุด</div>
        <div style={{ display:'flex', gap:16, marginBottom:10 }}>
          <span style={{ fontSize:11, color:'#F87171' }}>■ ตัดสต็อก</span>
          <span style={{ fontSize:11, color:'#34D399' }}>■ เติมสต็อก</span>
        </div>
        <div style={{ display:'flex', gap:10, height:140, alignItems:'flex-end' }}>
          {last7.map(d => (
            <div key={d.key} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
              <div style={{ width:'100%', display:'flex', gap:2, height:120, alignItems:'flex-end' }}>
                <div title={`ขาย: ${d.sold}`} style={{ flex:1, background:'#F87171', borderRadius:'3px 3px 0 0', height:`${(d.sold/maxBar)*100}%`, minHeight: d.sold?2:0, transition:'height .3s' }} />
                <div title={`เติม: ${d.restocked}`} style={{ flex:1, background:'#34D399', borderRadius:'3px 3px 0 0', height:`${(d.restocked/maxBar)*100}%`, minHeight: d.restocked?2:0, transition:'height .3s' }} />
              </div>
              <span style={{ fontSize:10, color:C.muted, textAlign:'center', whiteSpace:'nowrap' }}>{d.label}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Filters + table */}
      <div style={{ display:'flex', gap:10, flexWrap:'wrap', alignItems:'center' }}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 ค้นหา SKU / ชื่อสินค้า..."
          style={{ ...S.input, width:220 }} onFocus={e=>e.target.style.borderColor='#3B82F6'} onBlur={e=>e.target.style.borderColor=C.border} />
        <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{ ...S.input, width:'auto' }}>
          <option value="">ทุกประเภท</option>
          <option value="sale">ตัดสต็อก</option>
          <option value="restock">เติมสต็อก</option>
          <option value="adjust">ปรับสต็อก</option>
        </select>
        <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, color:C.muted }}>
          <span>จาก</span>
          <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={{ ...S.input, width:140, fontSize:12 }} />
          <span>ถึง</span>
          <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={{ ...S.input, width:140, fontSize:12 }} />
        </div>
        <button style={S.btn(C.border, C.muted)} onClick={exportLog}>⬇ Export CSV</button>
        {(typeFilter||search||dateFrom||dateTo) && (
          <button style={{ ...S.btn(C.border,'#F87171'), fontSize:11 }} onClick={()=>{setTypeFilter('');setSearch('');setDateFrom('');setDateTo('')}}>× ล้างตัวกรอง</button>
        )}
        <span style={{ marginLeft:'auto', fontSize:12, color:C.muted }}>{filtered.length} รายการ</span>
      </div>

      <div style={{ ...S.card, padding:0, overflow:'hidden', flex:1 }}>
        <div style={{ overflowX:'auto', height:'100%' }}>
          <table style={S.table}>
            <thead>
              <tr>
                {['วันที่เวลา','ประเภท','SKU','สินค้า','จำนวน','สต็อกก่อน','สต็อกหลัง','หมายเหตุ'].map(h => (
                  <th key={h} style={{ ...S.th, textAlign:['จำนวน','สต็อกก่อน','สต็อกหลัง'].includes(h)?'center':'left' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 && (
                <tr><td colSpan={8} style={{ ...S.td, textAlign:'center', color:C.muted, padding:40 }}>ยังไม่มีประวัติสต็อก</td></tr>
              )}
              {filtered.map(l => (
                <tr key={l.id}>
                  <td style={{ ...S.td, fontSize:12, color:C.muted, whiteSpace:'nowrap' }}>
                    {new Date(l.created_at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}
                  </td>
                  <td style={S.td}>
                    <span style={{ background:typeBg(l.type), color:typeColor(l.type), padding:'2px 8px', borderRadius:20, fontSize:11, fontWeight:600 }}>
                      {typeLabel(l.type)}
                    </span>
                  </td>
                  <td style={{ ...S.td, fontFamily:'monospace', fontSize:12, color:C.muted }}>{l.product_sku}</td>
                  <td style={{ ...S.td, fontWeight:500 }}>{l.product_name}</td>
                  <td style={{ ...S.td, textAlign:'center', fontWeight:700, color: l.qty_change < 0 ? '#F87171' : '#34D399' }}>
                    {l.qty_change > 0 ? '+' : ''}{l.qty_change}
                  </td>
                  <td style={{ ...S.td, textAlign:'center', color:C.muted }}>{l.stock_before}</td>
                  <td style={{ ...S.td, textAlign:'center', fontWeight:600 }}>{l.stock_after}</td>
                  <td style={{ ...S.td, fontSize:12, color:C.muted }}>{l.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  )
}

// ===================== TOPBAR =====================
const PAGE_TITLES = { dashboard:'Dashboard', stores:'Store Hub', products:'รายการสินค้า', team:'ทีมงาน', suppliers:'ซัพพลายเออร์', ads:'Ads Tracking', orders:'บันทึกการขาย', stocklog:'ประวัติสต็อก' }

function TopBar({ page }) {
  const now = new Date().toLocaleDateString('th-TH',{dateStyle:'long'})
  return (
    <div style={{ height:52, background:C.surface, borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px', flexShrink:0 }}>
      <span style={{ fontWeight:600, fontSize:16 }}>{PAGE_TITLES[page]}</span>
      <span style={{ fontSize:13, color:C.muted }}>{now}</span>
    </div>
  )
}

// ===================== APP ROOT =====================
function App() {
  const [page, setPage] = useState('dashboard')
  const [saleOpen, setSaleOpen] = useState(false)
  const [addStockOpen, setAddStockOpen] = useState(false)
  const [orderOpen, setOrderOpen] = useState(false)
  const [refreshKey, setRefreshKey] = useState(0)
  const reload = () => setRefreshKey(k => k+1)
  const pages = {
    dashboard:<Dashboard key={refreshKey}/>,
    stores:<StoreHub/>, products:<ProductList/>, team:<TeamPage/>,
    suppliers:<SupplierList/>, ads:<AdsPage/>,
    orders:<OrdersPage key={refreshKey}/>, stocklog:<StockLogPage key={refreshKey}/>
  }
  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar page={page} setPage={setPage}
        onSaleOpen={()=>setSaleOpen(true)}
        onAddStockOpen={()=>setAddStockOpen(true)}
        onOrderOpen={()=>setOrderOpen(true)}
      />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <TopBar page={page} />
        <div style={{ flex:1, overflow:'hidden' }}>{pages[page]}</div>
      </div>
      <ToastContainer />
      {saleOpen    && <SaleModal     onClose={()=>{setSaleOpen(false);reload()}} />}
      {addStockOpen && <AddStockModal onClose={()=>{setAddStockOpen(false);reload()}} />}
      {orderOpen   && <OrderModal    onClose={()=>{setOrderOpen(false);reload()}} onSaved={reload} />}
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
